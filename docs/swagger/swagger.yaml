basePath: /api/v1
host: localhost:8080
info:
  contact: {}
  description: REST API for managing the Mikrotik network security system
  title: Mikrotik Intelligent Defender API
  version: "1.0"
paths:
  /attackers:
    get:
      description: Returns top attacking IP addresses
      parameters:
      - description: Number of attackers to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get top attackers
      tags:
      - attackers
  /blocked:
    get:
      description: Returns list of currently blocked IP addresses
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get blocked IPs
      tags:
      - blocked
  /blocked/{ip}:
    delete:
      description: Removes an IP from the blacklist
      parameters:
      - description: IP address to unblock
        in: path
        name: ip
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Unblock an IP
      tags:
      - blocked
  /events:
    get:
      description: Returns recent attack events
      parameters:
      - description: Number of events to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get recent events
      tags:
      - events
  /stats:
    get:
      description: Returns total events, blocked IPs and events in last 24h
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: integer
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get system statistics
      tags:
      - stats
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
